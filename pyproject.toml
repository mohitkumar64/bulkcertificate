[project]
name = "bulkcertificate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohit kumar", email = "mk7004048@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "email-validator>=2.0.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0.0",
    "svglib>=2.3.0",
    "uvicorn>=0.54.0",
    "xhtml2pdf>=0.2.22",
]

[project.scripts]
bulkcertificate = "bulkcertificate:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_jobs.py", "test_validation.py", "test_generator.py", "test_retrieval.py"]

